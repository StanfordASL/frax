[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "frax"
version = "0.1.0"
description = "Fast Robot Kinematics and Dynamics in JAX"
authors = [{ name = "Daniel Morton", email = "danielpmorton@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robot", "kinematics", "dynamics", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy", "jax", "pyyaml", "networkx", "lxml", "packaging"]

[project.urls]
Repository = "https://github.com/StanfordASL/frax/"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]
tpu = ["jax[tpu]"]
dev = ["mkdocs-material", "mkdocstrings[python]", "ruff"]
ik = [
    "elastiqp[jax]>=0.1.0",
    "jax>=0.9.1",           # for elastiqp
    "scipy",
]
examples = [
    "frax[ik]",
    "mujoco>=3.3.1",          # for MjSpec URDF loading
    "cbfpy[elastiqp]>=0.1.0",
    "viser[urdf]",
]
test = ["frax[ik]", "pin", "pytest>=9", "mujoco"]
all = ["frax[dev,ik,examples,test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["frax*"]

[tool.setuptools.package-data]
frax = ["assets/**/*"]
